name: Cloud Run Deploy via Artifact Registry
description: Deploys containers to Google Cloud Run via Google Artifact Registry
inputs:
  GOOGLE_CLOUD_PROJECT_ID:
    description: Google Cloud Project ID you want to use.
    required: true
  WORKLOAD_IDENTITY_PROVIDER:
    description: Full resource name of the Workload Identity Provider. The calling job needs id-token write permission.
    required: true
  SERVICE_ACCOUNT:
    description: Email of the service account to deploy as.
    required: true
  DOCKER_BUILD_ARGS:
    description: If you want to inject build params to docker build step.
    required: false
    default: ""
  ARTIFACT_REGISTRY_REGION:
    description: Google Artifact Registry region you want to use
    required: true
  ARTIFACT_REGISTRY_REPO:
    description: Google artifact Registry repository you want to store your build image in
    required: true
  ARTIFACT_REGISTRY_IMAGE:
    description: Google Artifact Registry image
    required: true
  IMAGE_TAG:
    description: Tag for your image
    required: true
  CLOUD_RUN_SERVICE_NAME:
    description: Google Cloud Run Service name you want to deploy
    required: true
  CLOUD_RUN_REGION:
    description: The region you want your service to run
    required: true
  CLOUD_RUN_SECRETS:
    description: 'Cloud Run secrets to mount or use env vars '
    required: false
    default: ""
  CLOUD_RUN_ENV_VARS:
    description: 'Cloud Run env vars '
    required: false
    default: ""
outputs:
  PREVIEW_URL:
    description: The url for the cloud run environment
    value: ${{ steps.deploy.outputs.url }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
    - name: Auth Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        project_id: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
        workload_identity_provider: ${{ inputs.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ inputs.SERVICE_ACCOUNT }}
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        project_id: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
    - name: Setup Docker Auth
      shell: bash
      env:
        REGION: ${{ inputs.ARTIFACT_REGISTRY_REGION }}
      run: gcloud --quiet auth configure-docker "${REGION}-docker.pkg.dev"
    - id: set-image-tag
      name: Setup AR image tag url and url friendly revision tag
      shell: bash
      env:
        REGION: ${{ inputs.ARTIFACT_REGISTRY_REGION }}
        PROJECT: ${{ inputs.GOOGLE_CLOUD_PROJECT_ID }}
        REPO: ${{ inputs.ARTIFACT_REGISTRY_REPO }}
        IMAGE: ${{ inputs.ARTIFACT_REGISTRY_IMAGE }}
        TAG: ${{ inputs.IMAGE_TAG }}
      # Cloud Run revision tags only allow lowercase letters, digits and hyphens
      run: |
        revision_tag="${TAG,,}"
        revision_tag="${revision_tag//[^a-z0-9-]/-}"
        delimiter="$(openssl rand -hex 8)"
        {
          echo "ar_image_tag<<$delimiter"
          echo "${REGION}-docker.pkg.dev/${PROJECT}/${REPO}/${IMAGE}:${TAG}"
          echo "$delimiter"
          echo "revision_tag<<$delimiter"
          echo "$revision_tag"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
    - name: Building the Docker Image
      shell: bash
      env:
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
        IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        BUILD_ARGS: ${{ inputs.DOCKER_BUILD_ARGS }}
      # Note: $BUILD_ARGS is intentionally left unquoted here so that multiple build args split properly;
      # set -f stops that split from also expanding globs
      run: |
        set -f
        docker build --tag "$AR_IMAGE_TAG" --build-arg version="$IMAGE_TAG" $BUILD_ARGS .
    - name: Push the Image to Google Artifact Registry
      shell: bash
      env:
        AR_IMAGE_TAG: ${{ steps.set-image-tag.outputs.ar_image_tag }}
      run: docker push "$AR_IMAGE_TAG"
    - id: deploy
      uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
      with:
        service: ${{ inputs.CLOUD_RUN_SERVICE_NAME }}
        image: ${{ steps.set-image-tag.outputs.ar_image_tag }}
        tag: ${{ steps.set-image-tag.outputs.revision_tag }}
        region: ${{ inputs.CLOUD_RUN_REGION }}
        env_vars: ${{ inputs.CLOUD_RUN_ENV_VARS }}
        secrets: ${{ inputs.CLOUD_RUN_SECRETS }}
